<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Аккорды RCC Worship</title>
  <script>
    // GitHub Pages отдаёт 404.html на любой несуществующий путь. Кладём
    // запрошенный адрес в sessionStorage и уходим на корень — там index.html
    // вернёт его в адресную строку через history.replaceState, и docsify в
    // режиме routerMode:'history' сразу откроет страницу по чистому адресу
    // (например, /set?song_id=1 или /songs/42?key=A), без решётки.
    sessionStorage.setItem('redirect', location.href);
    location.replace('/');
  </script>
</head>
<body>
  <p>Перенаправление… <a href="/">На главную</a></p>
</body>
</html>
