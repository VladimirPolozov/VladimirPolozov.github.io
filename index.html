<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аккорды RCC Worship</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
      #app-footer {
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        margin-top: 16px;
        padding: 12px 16px;
        text-align: center;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
      }
      .markdown-section {
        padding-bottom: 8px;
      }
      @media (max-width: 600px) {
        #app-footer {
          padding: 10px 10px;
          font-size: 11px;
          line-height: 1.3;
        }
        .markdown-section {
          padding-left: 12px;
          padding-right: 12px;
        }
        html, body {
          overflow-x: hidden;
        }
      }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Аккорды RCC Worship',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      markdown: {
        breaks: true
      },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Поиск: название или строка из песни',
        noData: 'Ничего не найдено',
        depth: 1,
        namespace: 'rcc1'
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section') || document.querySelector('.content');
            if (!section || section.querySelector('#app-footer')) return;
            var f = document.createElement('div');
            f.id = 'app-footer';
            f.textContent = 'Централизованная религиозная организация христиан веры евангельской (пятидесятников) Объединение церквей «Христа Воскресшего»';
            section.appendChild(f);
          });
        }
      ]
    };
  </script>
  <script src="tools/transpose-core.js"></script>
  <script src="tools/transpose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
