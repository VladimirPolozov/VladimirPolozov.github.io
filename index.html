<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аккорды RCC Worship</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
      :root {
        --bg: #F7F9FA;
        --surface: #FFFFFF;
        --text: #111418;
        --text-2: #5E6872;
        --text-3: #8A949D;
        --text-disabled: #C7CED4;
        --border: #E4E9ED;
        --border-thin: #EEF1F3;
        --accent: #56C4FD;
        --accent-hover: #35B6F9;
        --accent-active: #159FE8;
        --accent-dark: #0B8DCE;
        --bg-accent: #EAF7FE;
        --bg-accent-2: #F4FBFF;
        --shadow: rgba(30, 45, 55, 0.08);
        --shadow-light: rgba(255, 255, 255, 0.90);
        --theme-color: #159FE8;
      }

      body, .app, .content {
        background: var(--bg);
        color: var(--text);
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
      }

      .content {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 16px;
      }

      .markdown-section {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
        padding: 24px 28px 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 6px 6px 16px var(--shadow), -6px -6px 16px var(--shadow-light);
        color: var(--text);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3,
      .markdown-section h4,
      .markdown-section h5,
      .markdown-section h6 {
        color: var(--text);
      }

      a {
        color: var(--accent-active);
      }
      a:hover {
        color: var(--accent-dark);
      }

      .sidebar-nav a {
        color: var(--text-2);
      }
      .sidebar-nav a:hover {
        color: var(--text);
      }
      .sidebar-nav > a.active,
      .sidebar-nav > ul > li > a.active {
        color: var(--accent-dark);
        background: var(--bg-accent);
        border-radius: 6px;
      }

      mark {
        background: var(--bg-accent);
        color: var(--accent-dark);
      }

      #app-footer {
        border-top: 1px solid var(--border-thin);
        margin: auto 0 0;
        padding: 16px;
        background: transparent;
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        line-height: 1.4;
      }

      .markdown-section a {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .search input {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(86, 196, 253, 0.25);
      }

      @media (max-width: 600px) {
        .content {
          padding: 0;
        }
        .markdown-section {
          margin: 0;
          border: none;
          border-radius: 0;
          box-shadow: none;
          padding: 20px;
        }
        #app-footer {
          padding: 16px 16px 70px;
          font-size: 11px;
          line-height: 1.3;
        }
        html, body {
          overflow-x: hidden;
        }
      }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Аккорды RCC Worship',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      markdown: {
        breaks: true
      },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Поиск: название или строка из песни',
        noData: 'Ничего не найдено',
        depth: 1,
        namespace: 'rcc1'
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            window.scrollTo(0, 0);
            var content = document.querySelector('.content');
            if (content) content.scrollTop = 0;
          });
        },
        function (hook, vm) {
          hook.doneEach(function () {
            var content = document.querySelector('.content');
            if (!content || content.querySelector('#app-footer')) return;
            var f = document.createElement('div');
            f.id = 'app-footer';
            f.textContent = 'Централизованная религиозная организация христиан веры евангельской (пятидесятников) Объединение церквей «Христа Воскресшего»';
            content.appendChild(f);
          });
        }
      ]
    };
  </script>
  <script>
    // Автозакрытие сайдбара при выборе песни/ссылки (особенно на мобильном).
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('.sidebar-nav a, aside.sidebar a');
      if (a) {
        var sb = document.querySelector('.sidebar');
        if (sb) sb.classList.add('close');
      }
    });
  </script>
  <script src="tools/transpose-core.js?v=3"></script>
  <script src="tools/transpose.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
