<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аккорды RCC Worship</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
      #app-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
        padding: 8px 16px;
        text-align: center;
        font-size: 12px;
        color: #777;
        line-height: 1.5;
        z-index: 10;
      }
      .sidebar,
      .sidebar-nav {
        padding-bottom: 52px;
      }
      .markdown-section {
        padding-bottom: 56px;
      }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <div id="app-footer">Централизованная религиозная организация христиан веры евангельской (пятидесятников) Объединение церквей «Христа Воскресшего»</div>
  <script>
    window.$docsify = {
      name: 'Аккорды RCC Worship',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,
      formatUpdated: '{YYYY}-{MM}-{DD}',
      markdown: {
        breaks: true
      },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
        search: {
          placeholder: 'Поиск: название или строка из песни',
          noData: 'Ничего не найдено',
          depth: 1,
          namespace: 'rcc1'
        }
    };
  </script>
  <script src="tools/transpose-core.js"></script>
  <script src="tools/transpose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
